[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abstain-bench"
version = "0.1.0"
description = "Behavioral Calibration Score benchmark for measuring confident-error rates in LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ArchzOS" }]
dependencies = [
  "duckdb>=1.0,<2",
  "streamlit>=1.36,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-mock>=3.14,<4",
]
bedrock = [
  "boto3>=1.34,<2",
]
openai = [
  "openai>=1.40,<2",
]

[project.scripts]
abstain-bench = "abstain_bench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["abstain_bench*"]
