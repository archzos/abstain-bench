name: Feature request
description: Propose an improvement to abstain-bench
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation are you hitting?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Evaluation impact
      description: How does this affect BCS correctness or reproducibility?
    validations:
      required: true
